# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen && xcodegen generate
# (The .xcodeproj is generated, not hand-edited, so the layout is reviewable.)
name: BuildSight
options:
  bundleIdPrefix: com.buildsight99
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
  postGenCommand: python3 scripts/fix_local_package_references.py
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""          # set DEVELOPMENT_TEAM in Config/Signing.xcconfig (see the .example)
packages:
  BuildSightKit:
    path: Packages/BuildSightKit
fileGroups: [docs, Backend, ML]
targets:
  BuildSight:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BuildSight
    dependencies:
      - package: BuildSightKit
      - target: BuildSightWidgets
    info:
      path: BuildSight/Info.plist
      properties:
        CFBundleDisplayName: BuildSight
        UILaunchScreen: { UIColorName: LaunchBackground }
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: BuildSight uses the camera to record site photos as evidence and to scan area QR codes.
        NSLocationAlwaysAndWhenInUseUsageDescription: BuildSight alerts you when you arrive at or leave a site, so evidence is logged to the right project.
        NSLocationWhenInUseUsageDescription: BuildSight attaches your position to photos, issues and inspections so supervisors can see where they happened.
        NSFaceIDUsageDescription: BuildSight uses Face ID to unlock the app on this device.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [buildsight]
        BuildSightBackendURL: $(BUILDSIGHT_BACKEND_URL)
        BuildSightAnonKey: $(BUILDSIGHT_ANON_KEY)
        BuildSightAppGroup: group.$(BUILDSIGHT_BUNDLE_ID)
    entitlements:
      path: BuildSight/BuildSight.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUILDSIGHT_BUNDLE_ID)]
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    postBuildScripts:
      - name: Bundle Core ML models
        path: scripts/bundle_models.sh
        basedOnDependencyAnalysis: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES            # lets the app run as a Mac app without the iOS simulator download
        PRODUCT_BUNDLE_IDENTIFIER: $(BUILDSIGHT_BUNDLE_ID)
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  BuildSightWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Widgets]
    dependencies:
      - package: BuildSightKit
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: BuildSight Widgets
        NSExtension: { NSExtensionPointIdentifier: com.apple.widgetkit-extension }
        BuildSightAppGroup: group.$(BUILDSIGHT_BUNDLE_ID)
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUILDSIGHT_BUNDLE_ID)]
    configFiles:
      Debug: Config/Widgets.xcconfig
      Release: Config/Widgets.xcconfig
    settings:
      base:
        SUPPORTS_MACCATALYST: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUILDSIGHT_BUNDLE_ID).widgets
